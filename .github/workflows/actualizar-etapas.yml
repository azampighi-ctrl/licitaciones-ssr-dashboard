name: Actualizar etapas

# Recalcula la etapa de cada licitación (vigente → aperturas → resultados → pasadas)
# con las fechas ya registradas. No consulta Mercado Público. Si hay cambios, hace commit
# y Vercel redespliega el dashboard.
on:
  schedule:
    - cron: "17 10 * * *"   # 07:17 Chile (UTC-3), antes del barrido de las 09:13
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  etapas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recalcular etapas
        run: node scripts/actualizar_etapas.js
      - name: Verificar que el sitio se genera
        run: node scripts/build.js
      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/; then echo "Sin cambios de etapa"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/licitaciones.json
          git commit -m "Etapas actualizadas $(TZ=America/Santiago date '+%d-%m-%Y')"
          git push
